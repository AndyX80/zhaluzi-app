<header style="background: var(--dk); color: #FFFFFF; padding: 18px 8px 14px 8px; display: flex; align-items: center; gap: 6px">
<button onClick="{{go.Main}}" aria-label="Назад" style="border: 0; background: transparent; width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
<h1 style="margin: 0; font-size: 19px; font-weight: 700; flex-grow: 1">Заказы</h1>
<span style="font-size: 13px; opacity: 0.85; padding-right: 10px">{{count}} шт</span>
</header>
<main style="padding: 12px 12px calc(200px + env(safe-area-inset-bottom, 0px)) 12px; display: flex; flex-direction: column; gap: 10px">
<input type="search" placeholder="Поиск: фамилия, телефон, номер" value="{{q}}" onInput="{{setQ}}" style="height: 48px; border: 1.5px solid #E3D5C3; border-radius: 14px; padding: 0 14px; font-size: 15px; box-sizing: border-box; width: 100%; background: var(--card)">
<div style="background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(20,40,60,0.12); padding: 12px 12px 4px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: var(--m1); font-weight: 600">Период (по дате заказа)</div>
<div style="display: flex; align-items: center; gap: 8px">
<input type="date" value="{{from}}" onChange="{{setFrom}}" aria-label="С даты" style="flex: 1 1 0; min-width: 0; height: 48px; border: 1.5px solid #E3D5C3; border-radius: 14px; padding: 0 8px; font-size: 15px; box-sizing: border-box; background: var(--card); color: var(--ink)">
<span style="color: var(--m1)">–</span>
<input type="date" value="{{to}}" onChange="{{setTo}}" aria-label="По дату" style="flex: 1 1 0; min-width: 0; height: 48px; border: 1.5px solid #E3D5C3; border-radius: 14px; padding: 0 8px; font-size: 15px; box-sizing: border-box; background: var(--card); color: var(--ink)">
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #EFE3D3">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button onClick="{{q.pick}}" style="{{q.style}}">{{q.name}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button>
</sc-for>
</div>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
<div role="button" onClick="{{o.open}}" style="cursor: pointer; text-decoration: none; color: inherit; background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(20,40,60,0.12); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 16px; font-weight: 700; flex-grow: 1">{{o.client}}</span>
<span style="font-size: 17px; font-weight: 800; color: #1E6B24">{{o.sum}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--m1)">
<span>№ {{o.num}} · {{o.date}}</span>
<span style="flex-grow: 1">· {{o.items}}</span>
<span style="{{o.badge}}">{{o.status}}</span>
</div>
<div style="font-size: 12px; color: var(--m2)">{{o.note}}</div>
</div>
</sc-for>
</main>
<div style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)) 12px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 64px; border-radius: 32px; background: var(--dk); color: #FFFFFF; display: flex; align-items: center; padding: 0 8px 0 22px; gap: 10px; box-shadow: 0 8px 20px rgba(40,20,10,0.35)">
<div style="flex-grow: 1; font-size: 15px; font-weight: 600">Заказов: {{count}}</div>
<button onClick="{{go.Main}}" style="border: 0; background: transparent; height: 48px; border-radius: 24px; background: var(--ac); color: #FFFFFF; font-size: 16px; font-weight: 800; padding: 0 20px; display: flex; align-items: center; gap: 8px; text-decoration: none; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Новый расчёт</button>
</div>
<div style="height: 60px; border-radius: 30px; background: var(--card); box-shadow: 0 4px 14px rgba(40,20,10,0.2); display: flex; align-items: center; gap: 4px; padding: 0 6px; font-size: 13px; font-weight: 700">
<button onClick="{{go.Main}}" aria-label="Расчёт" style="border: 0; background: transparent; text-decoration: none; flex: 1 1 0; height: 48px; color: var(--m2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></button>
<button onClick="{{go.Cart}}" aria-label="Корзина" style="border: 0; background: transparent; position: relative; text-decoration: none; flex: 1 1 0; height: 48px; color: var(--m2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6"></path></svg><b style="position: absolute; top: 2px; left: calc(50% + 4px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--ac); color: #FFFFFF; font-size: 11px; line-height: 18px; text-align: center">{{cartCount}}</b></button>
<div style="flex: 1.7 1 0; height: 48px; border-radius: 24px; background: var(--dk); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="3.5" cy="6" r="1"></circle><circle cx="3.5" cy="12" r="1"></circle><circle cx="3.5" cy="18" r="1"></circle></svg><span>Заказы</span></div>
<button onClick="{{go.Settings}}" aria-label="Настройки" style="border: 0; background: transparent; text-decoration: none; flex: 1 1 0; height: 48px; color: var(--m2); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
</div>
</div>
